[project]
name = "ai-investment-lab"
version = "0.1.0"
description = "A tiny AI-agent investment committee with deterministic risk controls."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lumibot>=4.5.91,<4.6",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.1,<2",
    "streamlit>=1.49,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
ai-investment-lab-backtest = "ai_investment_lab.backtest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_investment_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
